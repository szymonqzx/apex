name: APEX Kernel Matrix Build

# Builds every APEX kernel variant (the bisection stages as CI) so a
# feature-toggle regression never reaches a device. Inspired by
# WildKernels/GKI_KernelSU_SUSFS feature-set matrices (see docs/TOOLING.md).
#
# Variants mirror tools/device/stages-apex.txt:
#   plain  — Zepharo base, all APEX features off
#   ksu    — + KernelSU-Next
#   susfs  — + SUSFS hiding
#   bbg    — + Baseband Guard LSM
#   thermal— + thermal learner
#   full   — canonical apex_defconfig (everything)
#
# CI cannot catch a device boot hang — that is what tools/device/bisect-
# kernel.sh is for on hardware — but it guarantees every variant COMPILES.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/zepharo-rebase]
    paths: ['defconfig/**', 'patches/**', 'kernel/**', 'tools/build-kernel.sh', 'tools/apply-patches.sh']

jobs:
  matrix-build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, ksu, susfs, bbg, thermal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain deps
        run: |
          # vm.swappiness=80 — TNF builder tuning; keeps LTO links off the
          # OOM cliff on 16GB runners
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu ccache zip bc bison flex libssl-dev \
            libelf-dev aria2

      # Canonical toolchain is AOSP clang r547379 (clang 20) — see
      # tools/device/fetch-toolchain.sh and docs/TOOLING.md. r450784e
      # (clang 14) is only for the ci-r9-exact.yml bisection experiment;
      # build-kernel.sh rejects clang < 17.
      - name: Cache AOSP clang r547379 (canonical toolchain)
        uses: actions/cache@v4
        with:
          path: apex-toolchain
          key: aosp-clang-r547379

      - name: Fetch AOSP clang r547379 (skipped when cache hits)
        run: |
          if [ ! -x apex-toolchain/bin/clang ]; then
            SKIP_MAGISKBOOT=1 bash tools/device/fetch-toolchain.sh \
              --dir "$PWD/apex-toolchain"
          fi
          echo "APEX_TOOLCHAIN=$PWD/apex-toolchain" >> "$GITHUB_ENV"
          apex-toolchain/bin/clang --version | head -1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/apex-ccache
          key: apex-kernel-ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            apex-kernel-ccache-${{ matrix.variant }}-
            apex-kernel-ccache-

      - name: Enable ccache
        run: |
          mkdir -p /tmp/apex-ccache
          echo "CCACHE_DIR=/tmp/apex-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros,pch_defines,include_file_ctime,include_file_mtime" >> "$GITHUB_ENV"

      - name: Fetch kernel source
        run: |
          git clone --depth 1 --branch zepharo \
            https://github.com/topnotchfreaks/kernel_msm-5.15 kernel

      - name: Apply APEX patches
        run: bash tools/apply-patches.sh

      - name: Prepare variant defconfig
        run: |
          cp defconfig/apex_defconfig /tmp/variant_defconfig
          case "${{ matrix.variant }}" in
            plain)   sed -i -E 's/^CONFIG_(KSU|KSU_SUSFS|BBG|APEX_THERMAL)(_|=).*/# CONFIG_\1 is not set/' /tmp/variant_defconfig ;;
            ksu)     sed -i -E 's/^CONFIG_(KSU_SUSFS|BBG|APEX_THERMAL)(_|=).*/# CONFIG_\1 is not set/' /tmp/variant_defconfig ;;
            susfs)   sed -i -E 's/^CONFIG_(BBG|APEX_THERMAL)(_|=).*/# CONFIG_\1 is not set/' /tmp/variant_defconfig ;;
            bbg)     sed -i -E 's/^CONFIG_APEX_THERMAL(=.*)?/# CONFIG_APEX_THERMAL is not set/' /tmp/variant_defconfig ;;
            full)    : ;;
          esac
          cp /tmp/variant_defconfig defconfig/apex_defconfig

      - name: Build kernel
        run: bash tools/build-kernel.sh

      - name: Verify build output
        run: bash tools/verify.sh

      - name: Package AnyKernel3 zip
        run: bash tools/package-anykernel3.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-kernel-${{ matrix.variant }}
          path: |
            apex-kernel-*.zip
          retention-days: 14
