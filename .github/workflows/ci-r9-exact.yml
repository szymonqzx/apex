name: R9-Exact Reproducible Build

# THE decisive bisection experiment (see docs/CI.md + GBrain
# apex-device-flash-session-2026-09-08, Round 7-9).
#
# Mirrors TNF's own builder (.github/workflows/main.yml on the `builder`
# branch of topnotchfreaks/kernel_msm-5.15) — the pipeline that actually
# produces the R9 zips:
#
#   1. repo init the AOSP kernel manifest (common-android13-5.15-lts) —
#      this pulls the hermetic toolchain/prebuilts, NOT a bare clang tarball
#   2. clone the zepharo kernel source into common_<dev>/common
#   3. pin CLANG_VERSION in build.config.constants (R9-era: r450784e)
#   4. build via build/build.sh with BUILD_CONFIG=build.config.gki.aarch64
#   5. package the AnyKernel3 zip (R9-verbatim template)
#
# Contrast with our local repro (does NOT boot): clang r547379 (20) +
# bare-make thin LTO + -march=armv8.4-a. This workflow reproduces the
# official recipe exactly; if the artifact boots, the remaining deltas
# are bisected one at a time.
#
# Swap note: main.yml uses 15GB; YASK uses 10GB + vm.swappiness=80.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'zepharo commit — full 40-char SHA (empty = branch HEAD)'
        required: false
        default: '7bc9793d909f52f4a6cd45dd1381b2f200c18a7c'
      clang_version:
        description: 'CLANG_VERSION to pin in build.config.constants'
        required: false
        default: 'r450784e'
      lto:
        description: 'LTO mode (main.yml=thin, YASK=full)'
        required: false
        default: 'full'
        type: choice
        options: [full, thin]

jobs:
  build:
    name: r9-exact (build.sh, clang ${{ inputs.clang_version }}, LTO ${{ inputs.lto }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      kernelDir: common_gki
      kernelName: common
    steps:
      - uses: actions/checkout@v4

      - name: Setup swap 15GB + tune swappiness (TNF recipe)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 15

      - name: Tune swap
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Install deps
        run: |
          mkdir -p "${{ env.kernelDir }}"
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 zip

      - name: Clone kernel source (zepharo, pinned commit)
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --depth 1 --branch zepharo \
            https://github.com/topnotchfreaks/kernel_msm-5.15 ${{ env.kernelName }}
          head_sha=$(git -C ${{ env.kernelName }} rev-parse HEAD)
          echo "branch HEAD: $head_sha"
          if [ -n "${{ inputs.commit }}" ] && [ "$head_sha" != "${{ inputs.commit }}" ]; then
            echo "WARNING: zepharo HEAD $head_sha != pinned ${{ inputs.commit }}"
            git -C ${{ env.kernelName }} fetch --depth 1 origin ${{ inputs.commit }}
            git -C ${{ env.kernelName }} checkout ${{ inputs.commit }}
          fi
          git -C ${{ env.kernelName }} log --oneline -1

      - name: Init AOSP kernel manifest + toolchains
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j"$(nproc)"

          rm -rf .repo
          rm -rf common   # don't shadow our clone in common_gki/

          # Drop stale clang prebuilts (TNF does this too)
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          KDIR=${{ env.kernelDir }}/${{ env.kernelName }}

          # Pin the R9-era clang
          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=${{ inputs.clang_version }}/' \
            "$KDIR/build.config.constants"

          # gki_defconfig, no check_defconfig gate (mirrors main.yml)
          sed -i '/^DEFCONFIG=gki_defconfig/d' "$KDIR/build.config.gki"
          sed -i '$a\DEFCONFIG=gki_defconfig' "$KDIR/build.config.gki"
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' "$KDIR/build.config.gki"

          # Disable KMI strictness (mirrors main.yml)
          sed -i \
            -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
            -e '/^TRIM_NONLISTED_KMI=/d' \
            -e '/^KMI_ENFORCED=/d' \
            -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
            -e '$a\TRIM_NONLISTED_KMI=0' \
            -e '$a\KMI_ENFORCED=0' \
            -e '/^MODULES_ORDER=/d' \
            -e '/^MODULES_LIST=/d' \
            "$KDIR/build.config.gki.aarch64"

      - name: Configure defconfig extras (TNF appends these)
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: Build kernel (hermetic build.sh — official pipeline)
        run: |
          LTO=${{ inputs.lto }} \
          BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 \
            build/build.sh -j"$(nproc)"

      - name: Verify Image
        run: |
          # build.sh dist goes to out/<BRANCH>/dist (BRANCH=android13-5.15)
          DIST=$(dirname "$(find out -name Image -path '*/dist/*' | head -1)")
          echo "dist dir: $DIST"; ls -la "$DIST"/Image*
          strings "$DIST/Image" | grep -oE 'Linux version [0-9][^ ]*' | head -1
          echo "DIST_DIR=$DIST" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 zip (R9-verbatim template)
        run: |
          mkdir -p out/arch/arm64/boot
          cp "$DIST_DIR/Image" out/arch/arm64/boot/Image
          sed 's/VERSION="0.4.0-zepharo"/VERSION="0.4.0-r9-exact"/' \
            tools/package-anykernel3.sh > /tmp/pkg.sh
          chmod +x /tmp/pkg.sh
          APEX_NO_MODULES=1 /tmp/pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-kernel-r9-exact
          path: |
            apex-kernel-*.zip
          retention-days: 30
