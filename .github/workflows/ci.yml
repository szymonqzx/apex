name: APEX Kernel CI

on:
  push:
    branches: [main, feat/zepharo-rebase]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  certification-tests:
    name: Certification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest jsonschema

      - name: Run certification tests
        run: python3 -m pytest tests/cert/ -v --tb=short

  code-quality:
    name: Code Quality (checkpatch + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch kernel source for checkpatch script
        run: |
          # checkpatch.pl ships with the kernel; fetch a minimal tag (shallow)
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/topnotchfreaks/kernel_msm-5.15 /tmp/kcheck \
            || echo "clone failed (optional — falling back to local checkpatch if present)"

      - name: Run checkpatch on APEX sources
        run: |
          CHECKPATCH=""
          if [ -f /tmp/kcheck/scripts/checkpatch.pl ]; then
            CHECKPATCH="/tmp/kcheck/scripts/checkpatch.pl"
          elif [ -f kernel/scripts/checkpatch.pl ]; then
            CHECKPATCH="kernel/scripts/checkpatch.pl"
          fi
          if [ -z "$CHECKPATCH" ]; then
            echo "WARNING: checkpatch.pl unavailable — skipping (need kernel tree)"
            exit 0
          fi
          for f in patches/apex-new/apex-sysfs/src/apex_sysfs.c \
                   patches/apex-new/apex-charge/src/apex_charge.c; do
            echo "=== checkpatch: $f ==="
            perl "$CHECKPATCH" --no-tree --no-summary -f "$f"
          done

      - name: Shellcheck tools and scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x tools/build-kernel.sh tools/package-anykernel3.sh \
              tools/apply-patches.sh tools/release.sh tools/verify.sh \
              anykernel3/anykernel.sh || true
          else
            echo "shellcheck not installed — running bash -n only"
            bash -n tools/build-kernel.sh
            bash -n tools/package-anykernel3.sh
            bash -n tools/apply-patches.sh
            bash -n tools/release.sh
            bash -n tools/verify.sh
            bash -n anykernel3/anykernel.sh
          fi

      - name: Verify patch series integrity
        run: |
          if [ -f patches/apex-new/series ]; then
            while IFS= read -r line; do
              line="${line%%#*}"
              [ -z "${line// }" ] && continue
              patch=$(echo "$line" | awk '{print $1}')
              if [ -d "patches/apex-new/$patch" ]; then
                echo "  $patch: found"
              else
                echo "ERROR: $patch in series but directory not found"
                exit 1
              fi
            done < patches/apex-new/series
          else
            echo "ERROR: patches/apex-new/series not found"
            exit 1
          fi

  config-validation:
    name: Defconfig Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate apex_defconfig structure
        run: |
          DEFCONFIG="defconfig/apex_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found (source of truth)"
            exit 1
          fi
          echo "  $DEFCONFIG: $(grep -c 'CONFIG_' $DEFCONFIG) options"
          dupes=$(grep -oP 'CONFIG_\w+' "$DEFCONFIG" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: Duplicate configs: $dupes"
            exit 1
          fi
          # Profile overlays must not conflict with each other
          for frag in defconfig/profile-*.config; do
            [ -f "$frag" ] || continue
            dupes=$(grep -oP 'CONFIG_\w+' "$frag" | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "ERROR: Duplicate configs in $frag: $dupes"
              exit 1
            fi
          done
          echo "  All configs structurally valid"

  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schemas
        run: |
          python3 -c "
          import json, jsonschema, pathlib
          schemas = list(pathlib.Path('schemas').glob('*.schema.json'))
          if not schemas:
              print('No schemas found — skipping')
          for s in schemas:
              schema = json.loads(s.read_text())
              jsonschema.Draft7Validator.check_schema(schema)
              print(f'  {s.name}: valid')
          print('All schemas valid')
          "

  kernel-build:
    name: Kernel Build (Image + modules)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip bc bison flex libssl-dev libelf-dev

      - name: Fetch Zepharo R9 kernel source
        run: |
          git clone --depth 1 --branch ZEPHARO \
            https://github.com/topnotchfreaks/kernel_msm-5.15 kernel

      - name: Apply APEX patches
        run: bash tools/apply-patches.sh

      - name: Build kernel (incremental)
        run: bash tools/build-kernel.sh

      - name: Verify build output
        run: bash tools/verify.sh --strict

      - name: Package AnyKernel3 zip
        run: bash tools/package-anykernel3.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-kernel-zip
          path: |
            apex-kernel-*.zip
            apex-kernel-*.zip.sha256
          retention-days: 14
