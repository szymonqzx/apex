# apex thermald configuration
#
# REFERENCE DOCUMENTATION ONLY — not consumed by any daemon.
#
# APEX has no userspace thermald. All thermal policy is enforced in-kernel:
#   - CPU/GPU thermal: apex_thermal_uclamp.c + apex.c health tick
#   - Charging thermal: apex_charge.c (JEITA + 10-step ICC mitigation)
#
# This file documents the thermal trip points and charging policy for
# human reference. The kernel modules read battery/charger temperature
# directly from the power_supply class and apply mitigation automatically.
#
# The original mi_thermald is disabled by dirty-modify.sh because the
# APEX kernel modules handle all thermal policy with lower latency and
# more granular control than a userspace daemon.

# CPU thermal zone (cpu-therm)
[cpu-therm]
# Trip points in millidegrees Celsius
warn_temp=45000
throttle_temp=55000
critical_temp=65000

# When throttling, cap the big cluster (A73) first
throttle_cluster=big
throttle_freq_pct=70

# When critical, also cap the little cluster (A53)
critical_cluster=all
critical_freq_pct=50

# GPU thermal zone
[gpu-therm]
warn_temp=50000
throttle_temp=60000
critical_temp=70000

# Battery thermal zone
[battery-therm]
warn_temp=40000
throttle_temp=45000
critical_temp=50000

# Charger skin thermal zone (PM7250B charger_skin_therm)
# This is the skin temperature near the charger IC.
# During 33W fast charging, the charger IC can reach 60-70°C.
# We use the APEX Charge Manager's thermal_mitigation_idx to step
# down the charging current as skin temp rises.
[charger-skin-therm]
warn_temp=45000
throttle_temp=55000
critical_temp=65000

# When throttling, increase thermal_mitigation_idx to reduce charging current
# idx 0=5.4A → idx 4=3.0A (at 55°C skin)
throttle_charge_mit_idx=4

# When critical, increase to idx 7=1.5A (at 65°C skin)
critical_charge_mit_idx=7

# Charger die thermal zone (PM7250B internal)
# The DT sets charger-temp-max=800 (80°C) and smb-temp-max=800.
# We mirror this here for documentation.
[charger-die-therm]
warn_temp=60000
throttle_temp=70000
critical_temp=80000

# Charging-specific thermal policy
# When charging + battery temp > 40°C, reduce charge current (JEITA warm)
# When charging + battery temp > 45°C, stop charging (JEITA hot)
[charging-policy]
# JEITA warm threshold: reduce FCC to 2.5A
jeita_warm_temp=40000
jeita_warm_fcc_ua=2500000

# JEITA hot threshold: stop charging
jeita_hot_temp=45000

# JEITA cold threshold: reduce FCC to 2.5A, FV to 4.25V
jeita_cold_temp=5000
jeita_cold_fcc_ua=2500000

# Polling intervals (ms)
polling_interval=2000
