# Hiding stack target configuration
#
# Two lists:
#   [denylist]      apps that get ROOT hidden from them. Applied MANUALLY in
#                   the KSU manager: set per-app "Umount modules" for each of
#                   these (banking, streaming, MDM, detectors). Not consumed
#                   by any script.
#   [hidden-apps]   tool apps hidden FROM the targets. Consumed by
#                   configure_hiding.sh (sed-extracted to HMA's hide.list),
#                   and their /data/app dirs should also be added to
#                   sus_path.txt against raw directory scans.
#
# Format: one package name per line, comments start with #.

